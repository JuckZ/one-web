name: Deploy Extension

on:
  push:
    branches:
      - main
      - deploy
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test:coverage

      - name: Allow isolated default-port HTTP fixtures
        run: sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0

      - name: Prepare isolated Firefox audio output
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=oneweb_deploy

      - name: Build and verify Firefox extension
        env:
          PULSE_SINK: oneweb_deploy
        run: pnpm run verify:firefox

      - name: Package Firefox extension
        env:
          ONEWEB_EXTENSION_DIR: artifacts/test/firefox
        run: pnpm run pack:xpi && mv extension.xpi oneweb-firefox.xpi

      - name: Build Chromium extension
        run: pnpm run build

      - name: Package Chromium extension
        run: pnpm run pack:zip

      - name: Build standalone userscript
        run: pnpm run build:userscript

      - name: Upload browser artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-artifacts
          path: |
            extension.zip
            oneweb-firefox.xpi
            artifacts/build/userscript/one-web.user.js
            artifacts/build/userscript/one-web.meta.js
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish extension stores
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    if: github.ref == 'refs/heads/deploy'
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require exact-commit CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/agent-factory/require_ci.py --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --wait-seconds 900

      - name: Download extension artifact
        uses: actions/download-artifact@v4
        with:
          name: extension-artifacts

      - name: Publish to Chrome Web Store
        uses: wdzeng/chrome-extension@37f4f9cdc664959bafef36b1f4da03dec5141620 # v2
        with:
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          zip-path: extension.zip
          publisher-id: ${{ secrets.CHROME_PUBLISHER_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}

      - name: Publish to Edge Add-ons
        uses: wdzeng/edge-addon@e307af4adb6d4e1c12387dc7d6bd545dcd075909 # v1
        with:
          product-id: ${{ secrets.EDGE_PRODUCT_ID }}
          zip-path: extension.zip
          api-key: ${{ secrets.EDGE_API_KEY }}
          client-id: ${{ secrets.EDGE_CLIENT_ID }}

      - name: Publish to Firefox Add-ons
        uses: wdzeng/firefox-addon@3184ee491b500e080885e046051366a4228c6e5d # v1
        with:
          addon-guid: ${{ secrets.FIREFOX_ADDON_GUID }}
          xpi-path: oneweb-firefox.xpi
          self-hosted: false
          jwt-issuer: ${{ secrets.FIREFOX_JWT_ISSUER }}
          jwt-secret: ${{ secrets.FIREFOX_JWT_SECRET }}
