name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - work
      - deploy
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/deploy' }}

jobs:
  validate:
    name: Validate (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.x

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Factory core checks
        run: python3 scripts/agent-factory/factory.py check --config .agent-factory.ci.json

      - name: Upload core verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-verification-node-${{ matrix.node-version }}
          path: .git/agent-factory/runs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Install extension-capable Chromium
        run: pnpm exec playwright install --with-deps --no-shell chromium

      - name: Verify Chromium target
        run: pnpm run verify:chromium

      - name: Upload Chromium E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-e2e-node-${{ matrix.node-version }}
          path: artifacts/test-results/chromium/
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare isolated Firefox audio output
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=oneweb_ci

      - name: Verify Firefox target
        env:
          PULSE_SINK: oneweb_ci
        run: pnpm run verify:firefox
